server {
    listen 80 default_server;
    server_name 1.201.110.199;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://1.201.110.199$request_uri; }
}

server {
    listen 443 ssl;
    server_name 1.201.110.199;
    ssl_certificate /etc/letsencrypt/live/1.201.110.199/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1.201.110.199/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/sebit/current/sebitcanvers_v3/frontend/dist;
    index index.html;
    client_max_body_size 6m;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }
    location / { try_files $uri $uri/ /index.html; }
}
